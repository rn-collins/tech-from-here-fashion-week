<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Seven Fashion Week evidence lenses</title><desc id="desc">A non-quantitative comparison plate arranging seven cities and their editorial lenses around a shared evidence boundary. Position and line length do not represent rank or magnitude.</desc><rect width="1600" height="1000" fill="#f4efe4"/><style>text{font-family:Arial,sans-serif;fill:#151310}.serif{font-family:Georgia,serif}.city{font-size:29px;font-weight:700}.lens{font-size:23px}.note{font-size:19px}.line{stroke:#ee4b2b;stroke-width:4;fill:none}</style><text x="80" y="90" font-size="22" letter-spacing="6">TECH FROM HERE / COMPARATIVE PLATE</text><text class="serif" x="80" y="190" font-size="76">Seven lenses. No ranking.</text><circle cx="800" cy="540" r="120" fill="#151310"/><text x="800" y="525" text-anchor="middle" fill="#f4efe4" font-size="25">PUBLIC</text><text x="800" y="562" text-anchor="middle" fill="#f4efe4" font-size="25">EVIDENCE</text><g text-anchor="middle"><path class="line" d="M800 420L800 285"/><text class="city" x="800" y="240">LONDON</text><text class="lens" x="800" y="274">relay</text><path class="line" d="M690 455L505 340"/><text class="city" x="400" y="288">NEW YORK</text><text class="lens" x="400" y="322">clock</text><path class="line" d="M680 540L410 540"/><text class="city" x="260" y="525">MILAN</text><text class="lens" x="260" y="559">inheritance</text><path class="line" d="M690 625L505 740"/><text class="city" x="400" y="792">PARIS</text><text class="lens" x="400" y="826">legitimacy</text><path class="line" d="M910 625L1095 740"/><text class="city" x="1200" y="792">SHANGHAI</text><text class="lens" x="1200" y="826">synchronization</text><path class="line" d="M920 540L1190 540"/><text class="city" x="1340" y="525">COPENHAGEN</text><text class="lens" x="1340" y="559">verification</text><path class="line" d="M910 455L1095 340"/><text class="city" x="1200" y="288">TOKYO</text><text class="lens" x="1200" y="322">translation</text></g><text class="note" x="80" y="940">Editorial lenses, not measurements. The plate compares organizing questions; it does not score cities.</text></svg>
