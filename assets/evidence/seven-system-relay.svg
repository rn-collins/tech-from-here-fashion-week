<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Seven-system Fashion Week relay</title><desc id="desc">A non-quantitative evidence diagram showing access, stage, capture, circulation, backstage, commerce and memory as linked reporting systems. The sequence is an editorial method, not a measurement.</desc><rect width="1600" height="1000" fill="#f4efe4"/><style>text{font-family:Arial,sans-serif;fill:#151310}.serif{font-family:Georgia,serif}.n{font-size:22px;letter-spacing:3px}.label{font-size:25px;font-weight:700}.node{fill:#f4efe4;stroke:#151310;stroke-width:3}.path{fill:none;stroke:#1957ff;stroke-width:14}</style><text x="80" y="90" font-size="22" letter-spacing="6">TECH FROM HERE / SYSTEM RELAY</text><text class="serif" x="80" y="190" font-size="76">A look travels through systems.</text><path class="path" d="M170 485H1430"/><g text-anchor="middle"><g transform="translate(170 485)"><circle class="node" r="78"/><text class="n" y="-8">01</text><text class="label" y="30">ACCESS</text></g><g transform="translate(380 485)"><circle class="node" r="78"/><text class="n" y="-8">02</text><text class="label" y="30">STAGE</text></g><g transform="translate(590 485)"><circle class="node" r="78"/><text class="n" y="-8">03</text><text class="label" y="30">CAPTURE</text></g><g transform="translate(800 485)"><circle class="node" r="78"/><text class="n" y="-8">04</text><text class="label" y="30">FEED</text></g><g transform="translate(1010 485)"><circle class="node" r="78"/><text class="n" y="-8">05</text><text class="label" y="30">LABOR</text></g><g transform="translate(1220 485)"><circle class="node" r="78"/><text class="n" y="-8">06</text><text class="label" y="30">ORDER</text></g><g transform="translate(1430 485)"><circle class="node" r="78"/><text class="n" y="-8">07</text><text class="label" y="30">MEMORY</text></g></g><text x="80" y="825" font-size="25">Each handoff is a reporting question until a claim ID and source establish it.</text><text x="80" y="875" font-size="20">Spacing and sequence describe the editorial method; they do not quantify influence, speed or value.</text></svg>
