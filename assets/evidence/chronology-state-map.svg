<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Chronology evidence states</title><desc id="desc">A non-quantitative diagram distinguishing Then, Now and Next. Next includes documented trajectories and unresolved reporting questions, not predictions.</desc><rect width="1600" height="1000" fill="#151310"/><style>text{font-family:Arial,sans-serif;fill:#f4efe4}.serif{font-family:Georgia,serif}.label{font-size:31px;font-weight:700}.copy{font-size:23px}.box{fill:none;stroke:#f4efe4;stroke-width:3}.next{stroke:#ee4b2b}</style><text x="80" y="90" font-size="22" letter-spacing="6">TECH FROM HERE / EVIDENCE TIME</text><text class="serif" x="80" y="190" font-size="76">Three states, three burdens.</text><g><rect class="box" x="80" y="330" width="410" height="360"/><text class="label" x="125" y="410">THEN</text><text class="copy" x="125" y="478">A dated record of what</text><text class="copy" x="125" y="516">was publicly documented.</text><text class="copy" x="125" y="610">Not an origin myth.</text><rect class="box" x="595" y="330" width="410" height="360"/><text class="label" x="640" y="410">NOW</text><text class="copy" x="640" y="478">A current official surface</text><text class="copy" x="640" y="516">checked at publication.</text><text class="copy" x="640" y="610">Not universal practice.</text><rect class="box next" x="1110" y="330" width="410" height="360"/><text class="label" x="1155" y="410">NEXT</text><text class="copy" x="1155" y="478">A documented trajectory</text><text class="copy" x="1155" y="516">or open assignment.</text><text class="copy" x="1155" y="610">Not a forecast.</text></g><text class="copy" x="80" y="900">Box size and position do not encode quantity, certainty or progress.</text></svg>
